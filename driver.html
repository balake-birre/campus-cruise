<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise - Driver Navigation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        
        /* Driver Floating Control Panel */
        .driver-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); max-width: 300px;
            width: 260px;
        }
        .driver-panel h2 { margin: 0 0 5px 0; font-size: 20px; color: #111; font-weight: bold; }
        .driver-panel p { margin: 0 0 10px 0; font-size: 13px; color: #666; line-height: 1.4; }
        
        /* Student Live Headcount Badge */
        .counter-badge {
            background: #e3f2fd; color: #0d47a1; padding: 10px; 
            border-radius: 8px; font-weight: bold; font-size: 14px;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;
            border: 1px solid #bbdefb;
        }
        .counter-number { background: #007bff; color: white; padding: 2px 10px; border-radius: 20px; font-size: 14px; }

        /* Journey Control Management Buttons */
        .start-journey-btn {
            background: #28a745; color: white; border: none; padding: 12px; 
            font-weight: bold; font-size: 15px; border-radius: 8px; width: 100%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 12px; transition: background 0.2s;
        }
        .start-journey-btn:hover { background: #218838; }

        .end-journey-btn { 
            background: #dc3545; color: white; border: none; padding: 12px; 
            font-weight: bold; font-size: 15px; border-radius: 8px; width: 100%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 12px; transition: background 0.2s; display: none; /* Hidden by default */
        }
        .end-journey-btn:hover { background: #bd2130; }
        
        /* Dynamic Status Layouts */
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; font-weight: 500; }
        .status-dot { width: 10px; height: 10px; background-color: #6c757d; border-radius: 50%; display: inline-block; }
        .status-dot.online { background-color: #28a745; }
    </style>
</head>
<body>

    <div class="driver-panel">
        <h2>Driver Navigation</h2>
        <p>Manage transit tracking states and monitor commuter queues below.</p>
        
        <div class="counter-badge">
            <span>👥 Total Students Waiting:</span>
            <span id="waiting-count" class="counter-number">0</span>
        </div>

        <button id="start-btn" class="start-journey-btn" onclick="startJourney()">🚀 Start Journey</button>
        
        <button id="end-btn" class="end-journey-btn" onclick="endJourney()">🛑 End Journey</button>

        <div class="status-indicator">
            <span id="live-dot" class="status-dot"></span>
            <span id="live-text">Journey Offline</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = { databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Updated Pin Configuration: GREEN for the Shuttle Bus
        const shuttleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', 
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const studentIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',  
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        let myBusMarker = null;
        let studentMarkers = {}; 
        let geoWatchId = null;

        // 1. START JOURNEY ENGINE (Green Trigger Actions)
        function startJourney() {
            if (navigator.geolocation) {
                // UI changes immediately
                document.getElementById("start-btn").style.display = "none";
                document.getElementById("end-btn").style.display = "flex";
                document.getElementById("live-dot").classList.add("online");
                document.getElementById("live-text").innerText = "Broadcasting Live Location...";

                // Fire up real-time geolocation streaming watch
                geoWatchId = navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    if (!myBusMarker) {
                        myBusMarker = L.marker([lat, lon], { icon: shuttleIcon }).addTo(map)
                                       .bindPopup("<b>Your Bus (Active)</b>").openPopup();
                        map.setView([lat, lon], 16);
                    } else {
                        myBusMarker.setLatLng([lat, lon]);
                    }

                    // Feed coordinates out to Firebase node
                    db.ref('shuttles/live_bus').set({
                        lat: lat,
                        lon: lon,
                        tst: Math.floor(Date.now() / 1000)
                    });
                }, (err) => { console.error("GPS Tracking Error: ", err); }, { enableHighAccuracy: true });
            } else {
                alert("GPS functionality is disabled or unsupported on this device.");
            }
        }

        // 2. END JOURNEY ENGINE (Red Trigger Actions)
        function endJourney() {
            if (confirm("Are you sure you want to end this journey?")) {
                // Terminate device background GPS tracking
                if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
                
                // Discard active live tracking data block inside Firebase
                db.ref('shuttles/live_bus').remove();
                
                // Roll UI settings back to offline defaults
                document.getElementById("end-btn").style.display = "none";
                document.getElementById("start-btn").style.display = "flex";
                document.getElementById("live-dot").classList.remove("online");
                document.getElementById("live-text").innerText = "Journey Offline";
                
                if (myBusMarker) { map.removeLayer(myBusMarker); myBusMarker = null; }
            }
        }

        // 3. LISTEN DYNAMICALLY FOR BROADCASTING STUDENTS
        db.ref('students').on('value', (snapshot) => {
            const studentsData = snapshot.val() || {};
            
            const totalCount = Object.keys(studentsData).length;
            document.getElementById("waiting-count").innerText = totalCount;
            
            for (let id in studentMarkers) {
                if (!studentsData[id]) {
                    map.removeLayer(studentMarkers[id]);
                    delete studentMarkers[id];
                }
            }

            for (let id in studentsData) {
                const student = studentsData[id];
                if (student.lat && student.lon) {
                    if (!studentMarkers[id]) {
                        studentMarkers[id] = L.marker([student.lat, student.lon], { icon: studentIcon }).addTo(map)
                                               .bindPopup("<b>Waiting Student</b>");
                    } else {
                        studentMarkers[id].setLatLng([student.lat, student.lon]);
                    }
                }
            }
        });
    </script>
</body>
</html>

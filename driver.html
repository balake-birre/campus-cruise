<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise - Driver Console</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f6f9; padding: 40px 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        button { background: #28a745; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; }
        button:disabled { background: #ccc; }
        .status { margin-top: 20px; font-size: 16px; color: #555; font-weight: bold; }
        .offline-btn { background: #dc3545; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Driver Control Panel</h2>
        <p>Tap below to start broadcasting the shuttle location to students.</p>
        
        <button id="start-btn" onclick="startTracking()">📡 Start Journey</button>
        <button id="stop-btn" class="offline-btn" onclick="stopTracking()" style="display:none;">🛑 End Journey</button>
        
        <div id="status" class="status">Status: Offline</div>
    </div>

    <script>
        // Firebase Setup
        const firebaseConfig = {
            databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchId = null;

        function startTracking() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerText = "Error: GPS not supported on this phone.";
                return;
            }

            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').innerText = "Connecting GPS...";

            // Watch the phone's movement using native browser location services
            watchId = navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Send a clean, simple data package straight to Firebase
                db.ref('shuttles/live_bus').set({
                    lat: lat,
                    lon: lon,
                    tst: Math.floor(Date.now() / 1000)
                }).then(() => {
                    document.getElementById('status').innerHTML = `🟢 Broadcasting Live!<br><small>Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}</small>`;
                    document.getElementById('start-btn').style.display = "none";
                    document.getElementById('stop-btn').style.display = "block";
                }).catch((err) => {
                    document.getElementById('status').innerText = "Firebase Error: " + err.message;
                });

            }, (error) => {
                document.getElementById('status').innerText = "GPS Error: " + error.message;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('start-btn').innerText = "📡 Start Journey";
            }, {
                enableHighAccuracy: true, // Forces phone to use precise satellite GPS instead of generic cell towers
                maximumAge: 0
            });
        }

        function stopTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            // Let students know the shuttle is offline
            db.ref('shuttles/live_bus').remove();
            document.getElementById('status').innerText = "Status: Offline (Journey Ended)";
            document.getElementById('start-btn').style.display = "block";
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').innerText = "📡 Start Journey";
            document.getElementById('stop-btn').style.display = "none";
        }
    </script>
</body>
</html>

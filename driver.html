<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise - Driver Navigation</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        
        /* Driver Navigation Panel */
        .driver-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); max-width: 300px;
        }
        .driver-panel h2 { margin: 0 0 5px 0; font-size: 20px; color: #111; font-weight: bold; }
        .driver-panel p { margin: 0 0 10px 0; font-size: 13px; color: #666; line-height: 1.4; }
        
        /* New Live Counter Badge Styles */
        .counter-badge {
            background: #e3f2fd; color: #0d47a1; padding: 10px; 
            border-radius: 8px; font-weight: bold; font-size: 14px;
            margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;
            border: 1px solid #bbdefb;
        }
        .counter-number { background: #007bff; color: white; padding: 2px 10px; border-radius: 20px; font-size: 14px; }

        .end-journey-btn { 
            background: #dc3545; color: white; border: none; padding: 12px; 
            font-weight: bold; font-size: 15px; border-radius: 8px; width: 100%; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-bottom: 12px; transition: background 0.2s;
        }
        .end-journey-btn:hover { background: #bd2130; }
        
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; font-weight: 500; }
        .status-dot { width: 10px; height: 10px; background-color: #28a745; border-radius: 50%; display: inline-block; }
        .status-dot.offline { background-color: #6c757d; }
    </style>
</head>
<body>

    <div class="driver-panel">
        <h2>Driver Navigation</h2>
        <p>You will see waiting students appear on this map dynamically.</p>
        
        <div class="counter-badge">
            <span>👥 Total Students Waiting:</span>
            <span id="waiting-count" class="counter-number">0</span>
        </div>

        <button class="end-journey-btn" onclick="endJourney()">🛑 End Journey</button>
        <div class="status-indicator">
            <span id="live-dot" class="status-dot"></span>
            <span id="live-text">Broadcasting Live Location...</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = { databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const shuttleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', 
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const studentIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',  
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        let myBusMarker = null;
        let studentMarkers = {}; 
        let geoWatchId = null;

        // 1. WATCH DRIVER LOCATION
        if (navigator.geolocation) {
            geoWatchId = navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                if (!myBusMarker) {
                    myBusMarker = L.marker([lat, lon], { icon: shuttleIcon }).addTo(map)
                                   .bindPopup("<b>Your Bus</b>").openPopup();
                    map.setView([lat, lon], 16);
                } else {
                    myBusMarker.setLatLng([lat, lon]);
                }

                db.ref('shuttles/live_bus').set({
                    lat: lat,
                    lon: lon,
                    tst: Math.floor(Date.now() / 1000)
                });
            }, (err) => { console.error(err); }, { enableHighAccuracy: true });
        }

        // 2. LISTEN FOR STUDENTS & UPDATE THE COUNT DYNAMICALLY
        db.ref('students').on('value', (snapshot) => {
            const studentsData = snapshot.val() || {};
            
            // Calculate headcount by getting the number of active database keys
            const totalCount = Object.keys(studentsData).length;
            document.getElementById("waiting-count").innerText = totalCount;
            
            // Clean up removed pins
            for (let id in studentMarkers) {
                if (!studentsData[id]) {
                    map.removeLayer(studentMarkers[id]);
                    delete studentMarkers[id];
                }
            }

            // Render/Update student pins
            for (let id in studentsData) {
                const student = studentsData[id];
                if (student.lat && student.lon) {
                    if (!studentMarkers[id]) {
                        studentMarkers[id] = L.marker([student.lat, student.lon], { icon: studentIcon }).addTo(map)
                                               .bindPopup("<b>Waiting Student</b>");
                    } else {
                        studentMarkers[id].setLatLng([student.lat, student.lon]);
                    }
                }
            }
        });

        // 3. END JOURNEY
        function endJourney() {
            if (confirm("Are you sure you want to end this journey?")) {
                if (geoWatchId) navigator.geolocation.clearWatch(geoWatchId);
                db.ref('shuttles/live_bus').remove();
                
                document.getElementById("live-dot").classList.add("offline");
                document.getElementById("live-text").innerText = "Journey Ended. Offline.";
                if (myBusMarker) { map.removeLayer(myBusMarker); }
            }
        }
    </script>
</body>
</html>

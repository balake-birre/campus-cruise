<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise - Location Guessing Game</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* FIXED: Absolute positioning fixes the blank white map glitch seen in image_69ee04.png */
        #map { 
            position: absolute; 
            top: 0; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            z-index: 1; 
            background: #e5e3df; /* Gives a default map background color while loading */
        }
        
        /* Control Panel Container */
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 18px; border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.15); max-width: 290px;
            width: 260px;
        }

        .back-link {
            display: inline-block; font-size: 11px; color: #6c757d;
            text-decoration: none; margin-bottom: 12px; font-weight: bold;
        }
        .back-link:hover { color: #212529; }

        h1 { margin: 0 0 6px 0; font-size: 20px; color: #6f42c1; font-weight: bold; }
        p { margin: 0 0 14px 0; font-size: 13px; color: #555; line-height: 1.4; }
        
        /* Game Dashboard UI Components */
        .game-box {
            background: #f8f9fa; border-left: 4px solid #6f42c1;
            padding: 12px; border-radius: 0 6px 6px 0; margin-bottom: 14px;
        }
        .game-box h4 { margin: 0 0 6px 0; font-size: 14px; color: #212529; }
        .status-text { font-size: 13px; font-weight: bold; color: #495057; margin-bottom: 4px; }
        
        .badge {
            display: inline-block; padding: 4px 8px; font-size: 11px; 
            font-weight: bold; border-radius: 4px; color: white; margin-top: 5px;
        }
        .badge.cold { background-color: #007bff; }
        .badge.warm { background-color: #fd7e14; }
        .badge.hot { background-color: #dc3545; }
        .badge.win { background-color: #28a745; }

        .btn-reset {
            background: #6f42c1; color: white; border: none; padding: 10px;
            font-weight: bold; font-size: 13px; border-radius: 6px;
            width: 100%; cursor: pointer; transition: background 0.2s;
        }
        .btn-reset:hover { background: #5a32a3; }
    </style>
</head>
<body>

    <div class="status-panel">
        <a href="index.html" class="back-link">⬅️ Back to Main Menu</a>
        <h1>Campus Hunter</h1>
        <p>A secret target has been hidden on campus! Click anywhere on the map terrain to cast your guess.</p>
        
        <div class="game-box">
            <h4>Game Telemetry:</h4>
            <div id="target-clue" style="font-size: 12px; color: #6c757d; margin-bottom: 8px; font-style: italic;">Clue: Analyzing campus coordinates...</div>
            <div id="distance-output" class="status-text">Distance: Make a guess!</div>
            <div id="proximity-badge" class="badge" style="display: none;">COLD</div>
        </div>

        <button class="btn-reset" onclick="startNewGame()">🎲 Relocate Secret Target</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize the map centered around the main campus grounds
        const map = L.map('map').setView([-1.3193, 36.8162], 16);
        
        // Force Leaflet to recalculate the container size immediately to prevent blank tile bugs
        setTimeout(() => { map.invalidateSize(); }, 200);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Custom Pin Icons Configuration
        const guessIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const targetIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Predefined key campus landmarks for the target selection matrix
        const campusLandmarks = [
            { name: "near the main Engineering Hangar", lat: -1.3192, lon: 36.8158 },
            { name: "right outside the Main College Entrance Gate", lat: -1.3218, lon: 36.8140 },
            { name: "close to the Central Transport Depot", lat: -1.3205, lon: 36.8150 },
            { name: "near the Flight Sim Lab complex", lat: -1.3185, lon: 36.8170 },
            { name: "around the Campus Dining Square", lat: -1.3198, lon: 36.8165 }
        ];

        let secretTarget = null;
        let guessMarker = null;
        let targetMarker = null;
        let connectionLine = null;
        let gameWon = false;

        // Start the game loop on system load
        startNewGame();

        function startNewGame() {
            gameWon = false;
            
            // Clear existing map layers from previous sessions
            if (guessMarker) { map.removeLayer(guessMarker); guessMarker = null; }
            if (targetMarker) { map.removeLayer(targetMarker); targetMarker = null; }
            if (connectionLine) { map.removeLayer(connectionLine); connectionLine = null; }

            // Randomly select a secret location landmark anchor
            const randomSelection = campusLandmarks[Math.floor(Math.random() * campusLandmarks.length)];
            
            // Inject small random coordinate variance offset so the spot changes slightly every time
            const latOffset = (Math.random() - 0.5) * 0.0006;
            const lonOffset = (Math.random() - 0.5) * 0.0006;

            secretTarget = {
                lat: randomSelection.lat + latOffset,
                lon: randomSelection.lon + lonOffset,
                clue: randomSelection.name
            };

            // Update user dashboard elements
            document.getElementById("target-clue").innerText = "Clue: The target is hidden " + secretTarget.clue + ".";
            document.getElementById("distance-output").innerText = "Distance: Make a guess!";
            
            const badge = document.getElementById("proximity-badge");
            badge.style.display = "none";
            badge.className = "badge";
        }

        // Map Click Listener Event Router
        map.on('click', function(e) {
            if (gameWon) return; // Disallow tracking changes once target has been captured

            const guessLat = e.latlng.lat;
            const guessLon = e.latlng.lng;

            // Update or generate the guess pinpoint marker
            if (!guessMarker) {
                guessMarker = L.marker([guessLat, guessLon], { icon: guessIcon }).addTo(map);
            } else {
                guessMarker.setLatLng([guessLat, guessLon]);
            }

            // Calculate precise geodesic distance in meters using Leaflet's native coordinate tool
            const distanceInMeters = map.distance([guessLat, guessLon], [secretTarget.lat, secretTarget.lon]);
            
            updateGameFeedback(distanceInMeters, guessLat, guessLon);
        });

        function updateGameFeedback(distance, guessLat, guessLon) {
            const distanceText = document.getElementById("distance-output");
            const badge = document.getElementById("proximity-badge");
            
            distanceText.innerText = "Distance: " + Math.round(distance) + " meters away";
            badge.style.display = "inline-block";

            // Draw a temporary visual line connecting the guess to the actual location target
            if (connectionLine) map.removeLayer(connectionLine);
            connectionLine = L.polyline([[guessLat, guessLon], [secretTarget.lat, secretTarget.lon]], {
                color: '#6f42c1', weight: 2, dashArray: '5, 5', opacity: 0.7
            }).addTo(map);

            // Hot & Cold UI logic tiers
            if (distance <= 15) {
                // VICTORY CONDITION: Clicked within 15 meters of target
                gameWon = true;
                badge.innerText = "🏆 TARGET ACQUIRED!";
                badge.className = "badge win";
                distanceText.innerText = "Found it! Excellent navigation work.";
                
                // Drop the gold target flag to celebrate the win
                targetMarker = L.marker([secretTarget.lat, secretTarget.lon], { icon: targetIcon })
                                .addTo(map)
                                .bindPopup("<b>Secret Target Found!</b>").openPopup();
                
                // Automatically auto-fit focus zoom bounding box over the final vectors
                const group = new L.featureGroup([guessMarker, targetMarker]);
                map.fitBounds(group.getBounds().pad(0.2));
            } 
            else if (distance <= 50) {
                badge.innerText = "🔥 SCORCHING HOT!";
                badge.className = "badge hot";
            } 
            else if (distance <= 120) {
                badge.innerText = "☀️ WARM";
                badge.className = "badge warm";
            } 
            else {
                badge.innerText = "❄️ FREEZING COLD";
                badge.className = "badge cold";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise - Students Game Hub</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Control Panel Container styled for Gaming (Purple Theme) */
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 280px;
            width: 250px;
        }

        .back-link {
            display: inline-block;
            font-size: 11px;
            color: #6c757d;
            text-decoration: none;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .back-link:hover { color: #212529; }

        h1 { margin: 0 0 5px 0; font-size: 18px; color: #6f42c1; font-weight: bold; }
        p { margin: 0; font-size: 13px; color: #666; margin-bottom: 12px; line-height: 1.4; }
        
        /* Menu Layout Elements */
        .game-selector-wrapper { margin-bottom: 12px; }
        .game-selector-wrapper label { font-size: 11px; font-weight: bold; color: #495057; display: block; margin-bottom: 4px; }
        .game-selector-wrapper select { 
            width: 100%; padding: 8px; border-radius: 6px; 
            border: 2px solid #e9ecef; font-size: 12px; font-weight: bold; color: #495057;
            outline: none; transition: border-color 0.2s;
        }
        .game-selector-wrapper select:focus { border-color: #6f42c1; }
        
        /* Dynamic Rules Display Box */
        .game-status-box { background: #f8f9fa; border-left: 4px solid #6f42c1; padding: 10px; border-radius: 0 4px 4px 0; }
        .game-status-box h4 { margin: 0 0 4px 0; font-size: 13px; color: #111; }
        .game-status-box p { margin: 0; font-size: 11px; color: #555; line-height: 1.3; }
    </style>
</head>
<body>

    <div class="status-panel">
        <a href="index.html" class="back-link">⬅️ Back to Main Menu</a>

        <h1>Campus Hub Games</h1>
        <p>Play real-time location mini-games with your classmates across campus.</p>
        
        <div class="game-selector-wrapper">
            <label for="mode-select">Select Active Game Mode:</label>
            <select id="mode-select" onchange="switchApplicationMode()">
                <option value="none" selected disabled>-- Choose a Game --</option>
                <option value="fugitive">🏃 Mode 1: Digital Fugitive</option>
                <option value="landgrab">🚩 Mode 4: Geo-Fencing Land Grab</option>
            </select>
        </div>

        <div id="game-status-display" class="game-status-box" style="display: none;">
            <h4 id="game-title">Game Mode Idle</h4>
            <p id="game-instructions">Select a mode above to alter telemetry mechanics.</p>
            <div id="game-timer" style="display: none; font-weight: bold; margin-top: 5px; color: #dc3545;"></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Configuration Context
        const firebaseConfig = { databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Unique session string for the player instance
        const myUniqueId = "student_" + Math.random().toString(36).substr(2, 9);

        // Map setup
        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Player Icon configuration (Red Pin)
        const studentIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',

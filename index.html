<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise Live Shuttle Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 280px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
        p { margin: 0; font-size: 13px; color: #666; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h1>CampusCruise Live</h1>
        <p id="time-status">Shuttle is currently offline.</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Setup
        const firebaseConfig = {
            databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Map setup centered near college/Wilson Airport area
        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const shuttleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        let shuttleMarker = null;

        // Listen directly to the single row created by the driver console
        db.ref('shuttles/live_bus').on('value', (snapshot) => {
            const data = snapshot.val();
            
            if (data && data.lat && data.lon) {
                const lat = data.lat;
                const lng = data.lon;
                
                if (!shuttleMarker) {
                    shuttleMarker = L.marker([lat, lng], { icon: shuttleIcon }).addTo(map)
                                     .bindPopup("<b>Campus Shuttle</b><br>Live Tracking").openPopup();
                } else {
                    shuttleMarker.setLatLng([lat, lng]);
                }
                
                // Read exact phone generation time
                const timestamp = data.tst ? new Date(data.tst * 1000) : new Date();
                document.getElementById("time-status").innerText = "Active • Last updated: " + timestamp.toLocaleTimeString();
                
                // Pan map smoothly to the driver's current coordinates
                map.setView([lat, lng], map.getZoom());
            } else {
                document.getElementById("time-status").innerText = "Shuttle is currently offline.";
                if (shuttleMarker) {
                    map.removeLayer(shuttleMarker);
                    shuttleMarker = null;
                }
            }
        });
    </script>
</body>
</html>

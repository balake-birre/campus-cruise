<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise Live Shuttle Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 280px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
        p { margin: 0; font-size: 13px; color: #666; margin-bottom: 10px; }
        .student-toggle { background: #007bff; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 5px; width: 100%; cursor: pointer; }
        .sharing-active { background: #dc3545; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h1>CampusCruise Live</h1>
        <p id="time-status">Shuttle is currently offline.</p>
        <button id="share-btn" class="student-toggle" onclick="toggleStudentShare()">📍 Share My Position with Driver</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = { databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Unique ID for this specific student session
        const myUniqueId = "student_" + Math.random().toString(36).substr(2, 9);

        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Icons
        const shuttleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        const mySelfIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41]
        });

        let shuttleMarker = null;
        let mySelfMarker = null; // Local marker for this student only
        let studentWatchId = null;
        let isSharing = false;

        // 1. LISTEN TO SHUTTLE
        db.ref('shuttles/live_bus').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lon) {
                const lat = data.lat;
                const lng = data.lon;
                
                if (!shuttleMarker) {
                    shuttleMarker = L.marker([lat, lng], { icon: shuttleIcon }).addTo(map).bindPopup("<b>Shuttle Bus</b>").openPopup();
                } else {
                    shuttleMarker.setLatLng([lat, lng]);
                }
                const timestamp = data.tst ? new Date(data.tst * 1000) : new Date();
                document.getElementById("time-status").innerText = "Active • Updated: " + timestamp.toLocaleTimeString();
            } else {
                document.getElementById("time-status").innerText = "Shuttle is currently offline.";
                if (shuttleMarker) { map.removeLayer(shuttleMarker); shuttleMarker = null; }
            }
        });

        // 2. TOGGLE SHARING POSITION & SHOW SELF ON LOCAL MAP
        function toggleStudentShare() {
            if (!isSharing) {
                if (!navigator.geolocation) return alert("GPS not available");

                studentWatchId = navigator.geolocation.watchPosition((position) => {
                    const myLat = position.coords.latitude;
                    const myLon = position.coords.longitude;

                    // Send coordinates to Firebase (Only the driver reads this data path)
                    db.ref('students/' + myUniqueId).set({
                        lat: myLat,
                        lon: myLon
                    });

                    // Show the student their own position on their own screen
                    if (!mySelfMarker) {
                        mySelfMarker = L.marker([myLat, myLon], { icon: mySelfIcon }).addTo(map)
                                        .bindPopup("<b>You Are Here</b>").openPopup();
                    } else {
                        mySelfMarker.setLatLng([myLat, myLon]);
                    }

                }, (err) => { console.log(err); }, { enableHighAccuracy: true });

                document.getElementById('share-btn').innerText = "🛑 Stop Sharing Location";
                document.getElementById('share-btn').classList.add('sharing-active');
                isSharing = true;
            } else {
                stopSharing();
            }
        }

        function stopSharing() {
            if (studentWatchId) navigator.geolocation.clearWatch(studentWatchId);
            db.ref('students/' + myUniqueId).remove();
            
            // Remove their own pin from their map when they stop sharing
            if (mySelfMarker) {
                map.removeLayer(mySelfMarker);
                mySelfMarker = null;
            }

            document.getElementById('share-btn').innerText = "📍 Share My Position with Driver";
            document.getElementById('share-btn').classList.remove('sharing-active');
            isSharing = false;
        }

        // Clean up database if student closes tab completely
        window.addEventListener('beforeunload', () => {
            db.ref('students/' + myUniqueId).remove(); 
        });
    </script>
</body>
</html>

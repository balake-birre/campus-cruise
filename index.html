<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise Live Shuttle Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 280px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
        p { margin: 0; font-size: 13px; color: #666; margin-bottom: 10px; }
        .student-toggle { background: #007bff; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 5px; width: 100%; cursor: pointer; }
        .sharing-active { background: #dc3545; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h1>CampusCruise Live</h1>
        <p id="time-status">Locating shuttle and your position...</p>
        <button id="share-btn" class="student-toggle" onclick="toggleDriverBroadcast()">📍 Broadcast My Location to Driver</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = { databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Unique session ID for driver broadcast
        const myUniqueId = "student_" + Math.random().toString(36).substr(2, 9);

        // Initialize map
        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Tracking layers
        let shuttleDot = null;
        let mySelfDot = null; 
        let myAccuracyCircle = null; // Soft shading ring around the user
        
        let isBroadcasting = false;
        let currentLat = null;
        let currentLon = null;

        // Auto-adjust camera view to frame both dots perfectly on screen
        function autoFitBothMarkers() {
            if (shuttleDot && mySelfDot) {
                const bounds = L.latLngBounds([
                    shuttleDot.getLatLng(),
                    mySelfDot.getLatLng()
                ]);
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            }
        }

        // GPS STREAM 1: AUTOMATIC LOCAL USER LOCATION DOT (BLUE GPS DOT)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                // 1. Update/Create the soft accuracy outer circle
                if (!myAccuracyCircle) {
                    myAccuracyCircle = L.circle([currentLat, currentLon], {
                        radius: accuracy,
                        color: '#007bff',
                        fillColor: '#007bff',
                        fillOpacity: 0.15,
                        weight: 1
                    }).addTo(map);
                } else {
                    myAccuracyCircle.setLatLng([currentLat, currentLon]);
                    myAccuracyCircle.setRadius(accuracy);
                }

                // 2. Update/Create the core solid Blue Location Dot
                if (!mySelfDot) {
                    mySelfDot = L.circleMarker([currentLat, currentLon], {
                        radius: 8,
                        fillColor: '#007bff',
                        color: '#ffffff', // White border ring
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map).bindPopup("<b>You Are Here</b>").openPopup();
                } else {
                    mySelfDot.setLatLng([currentLat, currentLon]);
                }

                // Run camera framing
                autoFitBothMarkers();

                // Stream variables to Firebase if broadcast switch is active
                if (isBroadcasting) {
                    db.ref('students/' + myUniqueId).set({
                        lat: currentLat,
                        lon: currentLon
                    });
                }
            }, (err) => { console.error("GPS Error: ", err); }, { enableHighAccuracy: true });
        } else {
            alert("GPS services are not supported by this browser.");
        }

        // GPS STREAM 2: LIVE SHUTTLE BUS LOCATION DOT (GREEN TRACKING DOT)
        db.ref('shuttles/live_bus').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lon) {
                const lat = data.lat;
                const lng = data.lon;
                
                // Update/Create the clean Green Bus tracking dot
                if (!shuttleDot) {
                    shuttleDot = L.circleMarker([lat, lng], {
                        radius: 9,
                        fillColor: '#28a745', // Emerald Green
                        color: '#ffffff',     // White border ring
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map).bindPopup("<b>Shuttle Bus</b>");
                } else {
                    shuttleDot.setLatLng([lat, lng]);
                }

                // Run camera framing
                autoFitBothMarkers();

                const timestamp = data.tst ? new Date(data.tst * 1000) : new Date();
                document.getElementById("time-status").innerText = "Bus Active • Updated: " + timestamp.toLocaleTimeString();
            } else {
                document.getElementById("time-status").innerText = "Shuttle is currently offline.";
                if (shuttleDot) { map.removeLayer(shuttleDot); shuttleDot = null; }
            }
        });

        // BROADCAST INTERACTION LOGIC
        function toggleDriverBroadcast() {
            if (!isBroadcasting) {
                if (currentLat && currentLon) {
                    db.ref('students/' + myUniqueId).set({
                        lat: currentLat,
                        lon: currentLon
                    });
                }
                document.getElementById('share-btn').innerText = "🛑 Stop Broadcasting Location";
                document.getElementById('share-btn').classList.add('sharing-active');
                isBroadcasting = true;
            } else {
                stopBroadcasting();
            }
        }

        function stopBroadcasting() {
            db.ref('students/' + myUniqueId).remove();
            document.getElementById('share-btn').innerText = "📍 Broadcast My Location to Driver";
            document.getElementById('share-btn').classList.remove('sharing-active');
            isBroadcasting = false;
        }

        // Wipe data node instantly if user completely exits or terminates the tab session
        window.addEventListener('beforeunload', () => {
            db.ref('students/' + myUniqueId).remove();
        });
    </script>
</body>
</html>

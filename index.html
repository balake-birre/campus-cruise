<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise Live Shuttle Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 280px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
        p { margin: 0; font-size: 13px; color: #666; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h1>CampusCruise Live</h1>
        <p id="time-status">Waiting for live signal...</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Initialize Map (Centered around college/Wilson Airport coordinates)
        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Custom Green Shuttle Icon
        const shuttleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // 4. Live Real-Time Database Stream Loop
        let shuttleMarker = null;

        db.ref('shuttles/live_bus').orderByKey().limitToLast(1).on('value', (snapshot) => {
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    
                    if (data && data.lat && data.lon) {
                        const lat = data.lat;
                        const lng = data.lon;
                        
                        // Move or create the tracking pin instantly
                        if (!shuttleMarker) {
                            shuttleMarker = L.marker([lat, lng], { icon: shuttleIcon }).addTo(map)
                                             .bindPopup("<b>Campus Shuttle</b><br>Live Tracking").openPopup();
                        } else {
                            shuttleMarker.setLatLng([lat, lng]);
                        }
                        
                        // Update the interface clock layout text
                        const timestamp = data.tst ? new Date(data.tst * 1000) : new Date();
                        document.getElementById("time-status").innerText = "Active • Last updated: " + timestamp.toLocaleTimeString();
                    }
                });
            } else {
                document.getElementById("time-status").innerText = "Waiting for live signal...";
                if (shuttleMarker) {
                    map.removeLayer(shuttleMarker);
                    shuttleMarker = null;
                }
            }
        });
    </script>
</body>
</html>

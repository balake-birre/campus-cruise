<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise Live Shuttle Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 280px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
        p { margin: 0; font-size: 13px; color: #666; margin-bottom: 10px; }
        .student-toggle { background: #007bff; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 5px; width: 100%; cursor: pointer; }
        .sharing-active { background: #dc3545; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h1>CampusCruise Live</h1>
        <p id="time-status">Locating shuttle and your position...</p>
        <button id="share-btn" class="student-toggle" onclick="toggleDriverBroadcast()">📍 Broadcast My Location to Driver</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = { databaseURL: "https://shuttle-tracker-4c18f-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Unique session ID for driver broadcast
        const myUniqueId = "student_" + Math.random().toString(36).substr(2, 9);

        // Initialize map (will auto-adjust as soon as GPS streams kick in)
        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Custom Graphics Icons
        const shuttleIcon = L.icon({
            iconUrl: 'https://img.icons8.com/color/96/bus.png',
            iconSize: [45, 45],
            iconAnchor: [22, 22],
            popupAnchor: [0, -20]
        });

        const mySelfIcon = L.icon({
            iconUrl: 'https://img.icons8.com/color/96/student-male.png',
            iconSize: [42, 42],
            iconAnchor: [21, 21],
            popupAnchor: [0, -18]
        });

        let shuttleMarker = null;
        let mySelfMarker = null; 
        let isBroadcasting = false;
        let currentLat = null;
        let currentLon = null;

        // SMART FUNCTION: Auto-adjust map view to frame both GPS points perfectly
        function autoFitBothMarkers() {
            if (shuttleMarker && mySelfMarker) {
                const bounds = L.latLngBounds([
                    shuttleMarker.getLatLng(),
                    mySelfMarker.getLatLng()
                ]);
                // Adds 50px padding around the edges so icons don't hit the screen borders
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            }
        }

        // GPS STREAM 1: AUTOMATIC LOCAL STUDENT TRACKING
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;

                // Plot or update the student marker locally
                if (!mySelfMarker) {
                    mySelfMarker = L.marker([currentLat, currentLon], { icon: mySelfIcon }).addTo(map)
                                    .bindPopup("<b>You Are Here</b>").openPopup();
                } else {
                    mySelfMarker.setLatLng([currentLat, currentLon]);
                }

                // Auto-frame map camera to show both targets
                autoFitBothMarkers();

                // If broadcast switch is active, push data over to Firebase for the driver
                if (isBroadcasting) {
                    db.ref('students/' + myUniqueId).set({
                        lat: currentLat,
                        lon: currentLon
                    });
                }
            }, (err) => { console.error("Local GPS Error: ", err); }, { enableHighAccuracy: true });
        } else {
            alert("GPS services are not supported by this browser.");
        }

        // GPS STREAM 2: LIVE FIREBASE SHUTTLE TRACKING
        db.ref('shuttles/live_bus').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.lat && data.lon) {
                const lat = data.lat;
                const lng = data.lon;
                
                // Plot or update the shuttle marker
                if (!shuttleMarker) {
                    shuttleMarker = L.marker([lat, lng], { icon: shuttleIcon }).addTo(map)
                                    .bindPopup("<b>Shuttle Bus</b>");
                } else {
                    shuttleMarker.setLatLng([lat, lng]);
                }

                // Auto-frame map camera to show both targets
                autoFitBothMarkers();

                const timestamp = data.tst ? new Date(data.tst * 1000) : new Date();
                document.getElementById("time-status").innerText = "Bus Active • Updated: " + timestamp.toLocaleTimeString();
            } else {
                document.getElementById("time-status").innerText = "Shuttle is currently offline.";
                if (shuttleMarker) { map.removeLayer(shuttleMarker); shuttleMarker = null; }
            }
        });

        // BROADCAST TOGGLE INTERACTION
        function toggleDriverBroadcast() {
            if (!isBroadcasting) {
                if (currentLat && currentLon) {
                    db.ref('students/' + myUniqueId).set({
                        lat: currentLat,
                        lon: currentLon
                    });
                }
                document.getElementById('share-btn').innerText = "🛑 Stop Broadcasting Location";
                document.getElementById('share-btn').classList.add('sharing-active');
                isBroadcasting = true;
            } else {
                stopBroadcasting();
            }
        }

        function stopBroadcasting() {
            db.ref('students/' + myUniqueId).remove();
            document.getElementById('share-btn').innerText = "📍 Broadcast My Location to Driver";
            document.getElementById('share-btn').classList.remove('sharing-active');
            isBroadcasting = false;
        }

        // Clean-up node database path if window or tab session is destroyed
        window.addEventListener('beforeunload', () => {
            db.ref('students/' + myUniqueId).remove();
        });
    </script>
</body>
</html>

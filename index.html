<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCruise Live Shuttle Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100%; width: 100%; }
        .status-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 280px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #333; }
        p { margin: 0; font-size: 13px; color: #666; margin-bottom: 10px; }
        .student-toggle { background: #007bff; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 5px; width: 100%; cursor: pointer; }
        .sharing-active { background: #dc3545; }
    </style>
</head>
<body>

    <div class="status-panel">
        <h1>CampusCruise Live</h1>
        <p id="time-status">Determining your exact location...</p>
        <button id="share-btn" class="student-toggle" onclick="toggleDriverBroadcast()">📍 Broadcast My Location to Driver</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // No Firebase necessary for this simplified overlapping test file.
        // It relies entirely on your single device's local geolocation feed.

        // Initialize map centered around college area coordinates
        const map = L.map('map').setView([-1.3193, 36.8162], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Custom Graphics Icons (Matches your image format and color requests)
        const studentIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', // RED for student
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const shuttleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png', // BLUE for bus
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        let shuttleMarker = null; // Blue Pin (Bus)
        let mySelfMarker = null;  // Red Pin (User)
        
        // This button is preserved but has no function in this simplified file.
        let isBroadcasting = false;
        let currentLat = null;
        let currentLon = null;

        // SMART FUNCTION: Auto-adjust map view to frame both markers perfectly on screen together
        function autoFitBothMarkers() {
            if (shuttleMarker && mySelfMarker) {
                const bounds = L.latLngBounds([
                    shuttleMarker.getLatLng(),
                    mySelfMarker.getLatLng()
                ]);
                // Adds 50px padding around the edges so icons don't hit the screen borders
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            }
        }

        // CONSOLIDATED GPS STREAM: AUTOMATIC SINGLE-DEVICE TRACKING
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;

                // 1. Plot or update the Blue Shuttle Marker (Bus) first, so it's lower.
                if (!shuttleMarker) {
                    shuttleMarker = L.marker([currentLat, currentLon], { icon: shuttleIcon }).addTo(map)
                                    .bindPopup("<b>Shuttle Bus</b>").openPopup();
                } else {
                    shuttleMarker.setLatLng([currentLat, currentLon]);
                }

                // 2. Plot or update the Red Student Marker (User) second, and give it a higher z-index to stay on top.
                if (!mySelfMarker) {
                    mySelfMarker = L.marker([currentLat, currentLon], { icon: studentIcon, zIndexOffset: 1000 }).addTo(map)
                                    .bindPopup("<b>You Are Here</b>").openPopup();
                } else {
                    mySelfMarker.setLatLng([currentLat, currentLon]);
                }

                // Run auto-framing routine
                autoFitBothMarkers();

                const timestamp = new Date();
                document.getElementById("time-status").innerText = "Active • Both Pins at: " + timestamp.toLocaleTimeString();

            }, (err) => { console.error("GPS Access Error: ", err); }, { enableHighAccuracy: true });
        } else {
            alert("GPS services are not supported by this browser.");
        }

        // The button has no function for this simplified illustrative file.
        function toggleDriverBroadcast() {
             // Broadcast toggle interaction would be empty.
        }
    </script>
</body>
</html>
